name: Update program

on:
  schedule:
    - cron: "0 8 * * *"   # daily 17:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Use example config if no config.json is committed
        run: |
          if [ ! -f config.json ]; then cp config.example.json config.json; fi
      - run: python -m skytheater.run --config config.json --out docs
      - name: Commit if changed
        run: |
          git config user.name "sky-theater-bot"
          git config user.email "actions@github.com"
          git add docs/program.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update program"
            git push
          fi
